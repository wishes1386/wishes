<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報名統計系統</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logos">
        <span class="brand-logo-chip"><img src="/assets/cht-logo-combined.png" alt="中華電信與中華電信工會"></span>
      </span>
    </div>
    <button id="adminBtn" class="btn btn-ghost" type="button">
      <i data-lucide="lock-keyhole"></i>
      <span>後台登入</span>
    </button>
  </header>

  <main class="wrap">
    <section class="event-hero">
      <div class="hero-text">
        <p class="eyebrow">會員活動報名表</p>
        <h1 id="eventTitle">活動標題</h1>
        <p id="eventDesc" class="event-desc"></p>
        <div class="meta-row">
          <span class="chip chip-start">
            <i data-lucide="calendar-plus"></i>
            <span id="startText"></span>
          </span>
          <span class="chip chip-deadline">
            <i data-lucide="calendar-x"></i>
            <span id="deadlineText"></span>
          </span>
          <span class="chip chip-status" id="statusChip">
            <span class="status-dot"></span>
            <span id="statusText"></span>
          </span>
        </div>
      </div>
      <div class="hero-qr">
        <div class="qr-head">
          <i data-lucide="qrcode"></i>
          <h2>掃碼報名</h2>
        </div>
        <p class="qr-hint">手機掃描 QR Code，直接開啟此活動報名頁</p>
        <div id="qrCode" class="qr-code"></div>
        <p class="qr-url-label">目前報名網址</p>
        <p id="qrUrlText" class="qr-url"></p>
      </div>
    </section>

    <section class="form-panel">
      <div class="panel-head">
        <h2>選擇參加選項</h2>
        <p>單選；送出後用相同姓名再送出一次即可修改選擇。</p>
      </div>

      <form id="regForm" novalidate>
        <div class="identity-grid">
          <label class="field">
            <span>姓名</span>
            <input id="memberName" name="name" autocomplete="name" placeholder="與名冊一致的姓名" required>
          </label>
          <label class="field">
            <span>手機（選填）</span>
            <input id="memberPhone" name="phone" type="tel" placeholder="同名時請填寫，例 0912-345-678">
          </label>
          <label class="field">
            <span>身分證（選填）</span>
            <input id="memberId" name="idCard" maxlength="10" placeholder="例 A123456789">
          </label>
          <label class="field">
            <span>出生年月日（選填）</span>
            <input id="memberBirth" name="birthDate" type="date">
          </label>
        </div>
        <p class="field-note"><i data-lucide="info"></i><span>活動如有保險時需填寫正確</span></p>

        <div id="manualFields" class="identity-grid hidden">
          <label class="field">
            <span>Email（選填）</span>
            <input id="memberEmail" name="email" type="email" placeholder="name@example.com">
          </label>
        </div>

        <div id="options" class="option-grid"></div>
        <div id="formError" class="form-error hidden"></div>

        <button id="submitBtn" class="btn btn-primary btn-wide" type="submit">
          <i data-lucide="send"></i>
          <span>確認送出報名</span>
        </button>
      </form>

      <div id="result" class="result hidden"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="footerTitle">報名統計系統</span>
    <span>報名資料以送出時間為準</span>
  </footer>

  <div id="loginModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>後台登入</h3>
        <button id="loginClose" class="btn btn-icon" type="button" aria-label="關閉">
          <i data-lucide="x"></i>
        </button>
      </div>
      <p class="modal-hint">帳號固定為 admin</p>
      <form id="loginForm">
        <label class="field">
          <span>密碼</span>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="請輸入密碼" required>
        </label>
        <p id="loginError" class="form-error hidden"></p>
        <button class="btn btn-primary btn-wide" type="submit">
          <i data-lucide="log-in"></i>
          <span>登入後台</span>
        </button>
      </form>
    </div>
  </div>

  <div id="confirmModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3>送出前請確認</h3>
        <button id="confirmClose" class="btn btn-icon" type="button" aria-label="關閉">
          <i data-lucide="x"></i>
        </button>
      </div>
      <p class="modal-hint">請確認有無填寫錯誤</p>
      <div id="confirmSummary" class="confirm-summary"></div>
      <div class="confirm-actions">
        <button id="confirmBack" class="btn btn-ghost" type="button">返回修改</button>
        <button id="confirmSubmit" class="btn btn-primary" type="button">確認無誤，送出報名</button>
      </div>
    </div>
  </div>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
